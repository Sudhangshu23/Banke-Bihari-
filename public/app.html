<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#E8DDCA"><meta name="mobile-web-app-capable" content="yes">
<title>Banke Bihari Cafe</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Outfit:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--w:#F8F4EC;--iv:#E8DDCA;--be:#C1B4A4;--ca:#A87850;--co:#70452F;--es:#39271F}
*{box-sizing:border-box}body{margin:0;font:15px/24px 'DM Sans',sans-serif;background:var(--iv);color:var(--es);padding-bottom:90px}
header{position:sticky;top:0;z-index:5;padding:12px 20px;background:#E8DDCAd9;backdrop-filter:blur(14px);border-bottom:1px solid var(--be);display:flex;justify-content:space-between;align-items:center}
.logo{font:500 22px 'Space Grotesk';color:var(--co);letter-spacing:.2em}.tag{font:400 10px Outfit;letter-spacing:.22em;color:var(--es);display:block}
h2,h3{font-family:'Space Grotesk';font-weight:500;color:var(--co);letter-spacing:-.01em;margin:.4em 0}
main{padding:20px;max-width:1100px;margin:auto}.card{background:var(--w);border:1px solid var(--be);border-radius:6px;padding:18px;margin:10px 0;transition:.2s}.card:hover{border-color:var(--ca)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.price{color:var(--ca);font-weight:500}
button{background:var(--ca);color:var(--w);border:0;border-radius:4px;height:40px;padding:0 18px;font:600 12px Outfit;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.2s}
button:hover{background:var(--co)}button.alt{background:var(--w);color:var(--co);border:1px solid var(--co)}button.alt:hover{background:var(--iv)}
button.step{width:32px;height:32px;padding:0;border-radius:50%;font-size:16px}
input,select{width:100%;max-width:340px;padding:10px;margin:4px 0;border:1px solid var(--be);border-radius:4px;background:var(--w);color:var(--es);font:inherit}input:focus{outline:0;border-color:var(--ca)}
.chip{display:inline-block;height:24px;padding:0 10px;margin:2px;background:var(--iv);border:1px solid var(--be);border-radius:4px;font:600 10px/22px Outfit;letter-spacing:.18em;text-transform:uppercase;color:var(--co)}
.tabs{display:flex;gap:8px;overflow:auto;padding:6px 0}.tabs .chip{cursor:pointer;height:32px;line-height:30px}.tabs .on{background:var(--ca);color:var(--w);border-color:var(--ca)}
.bar{position:fixed;bottom:0;left:0;right:0;padding:12px 20px;background:#F8F4ECd9;backdrop-filter:blur(14px);border-top:1px solid var(--be);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
footer{background:var(--es);color:var(--iv);text-align:center;padding:18px;font:400 11px Outfit;letter-spacing:.2em}a{color:var(--co)}
body{min-height:100vh;display:flex;flex-direction:column}main{flex:1;width:100%}
.layout{display:flex;min-height:70vh}aside{width:200px;flex:none;background:var(--w);border-right:1px solid var(--be);padding:12px}
aside a{display:block;padding:10px 12px;margin:2px 0;border-radius:4px;cursor:pointer;font:500 12px Outfit;letter-spacing:.12em;text-transform:uppercase;color:var(--es)}aside a.on{background:var(--ca);color:var(--w)}
#view{flex:1;padding:20px;min-width:0}.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
table.t{width:100%;border-collapse:collapse}.t td,.t th{padding:8px;border-bottom:1px solid var(--be);text-align:left;font-size:14px}.t th{font:600 11px Outfit;letter-spacing:.14em;text-transform:uppercase;color:var(--co)}
.red{background:#ffdad6;color:#93000a;border-color:#ba1a1a}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media(max-width:760px){.layout{flex-direction:column}aside{width:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--be)}aside a{white-space:nowrap}}

.hello{font:500 15px 'Space Grotesk';color:var(--co);line-height:1.1;margin-right:8px}.hello small{display:block;font:400 11px Outfit;letter-spacing:.1em}
.bell{position:relative;width:40px;padding:0;background:var(--w);color:var(--es);border:1px solid var(--be);font-size:16px}.bell i{position:absolute;top:-6px;right:-6px;background:#ba1a1a;color:#fff;border-radius:50%;font:600 10px/16px Outfit;width:16px;height:16px;font-style:normal}
aside a i{font-style:normal;margin-right:8px}aside a b{float:right;background:#ba1a1a;color:#fff;border-radius:9px;font:600 10px/16px Outfit;min-width:16px;padding:0 4px;text-align:center}
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.dash>.card{margin:0}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1000px){.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}.tile{color:#fff;border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-size:20px;line-height:1.2;transition:.2s}.tile:hover{transform:translateY(-2px)}.tile.sel{outline:3px solid var(--es)}.tile b{display:block;font:600 15px Outfit}.tile small{color:#fff;font:400 11px Outfit}
.legend span{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px}
.sc{display:flex;gap:12px;align-items:center;border-left:5px solid var(--ca)}.sc div{font:500 28px 'Space Grotesk';color:var(--co)}.sc small{display:block;font:400 12px DM Sans}
.st-new{background:#ffdad6;color:#93000a}.st-accepted,.st-preparing{background:#f3d9b3;color:var(--co)}.st-ready{background:#d7e7cf;color:#2f5a1f}.st-served{background:#d6e3ef;color:#254b6e}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.steps span{padding:6px 10px;border:1px solid var(--be);border-radius:20px;font-size:12px}.steps .on{background:var(--ca);color:var(--w);border-color:var(--ca)}
.alert{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--be)}

button{touch-action:manipulation}aside a{position:relative}
@media(max-width:760px){
header{padding:8px 12px;flex-wrap:wrap;gap:6px}.tag,.hello small,#clk{display:none}.logo{font-size:18px}
.layout{display:block}aside{position:fixed;bottom:0;left:0;right:0;z-index:20;width:auto;display:flex;overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--be)}
aside a{flex:none;min-width:70px;text-align:center;font-size:10px;letter-spacing:.04em;padding:6px 4px;margin:0}aside a i{display:block;margin:0 0 2px;font-size:19px}aside a b{position:absolute;top:0;right:8px;float:none}
#view{padding:12px 12px 96px}body.staff footer{display:none}body:not(.staff){padding-bottom:190px}
button{min-height:44px}button.step{width:44px;height:44px;min-height:44px}input,select{font-size:16px;max-width:100%;min-height:42px}
.card{overflow-x:auto;padding:14px}.tiles{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}.row{gap:8px}.t td,.t th{padding:6px 4px;font-size:13px}
.bar{flex-direction:column;align-items:stretch;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.bar input{max-width:none;width:100%}.bar span{display:flex;gap:8px;flex-wrap:wrap}.bar button{flex:1}
.grid,.grid4{grid-template-columns:1fr}main{padding:12px}}
@media(min-width:761px) and (max-width:1100px){aside{width:150px}aside a{font-size:11px}button{min-height:44px}}
@media(max-width:760px){html,body{width:100%;max-width:100%;overflow-x:hidden}main,#view{min-width:0;width:100%}.layout,header{max-width:100%}img{max-width:100%;height:auto}button,a,select,input{touch-action:manipulation}table.t{display:block;max-width:100%;overflow-x:auto}} </style><style id="banke-bihari-white-neon-theme">:root{color-scheme:light;--bb-ink:#14221d;--bb-green:#00df86;--bb-blue:#087ff5}html,body{background:#fff!important;color:var(--bb-ink)!important}header,main,main section,footer{background-color:#fff!important;color:var(--bb-ink)!important}[class*="bg-[#E8DDCA]"],[class*="bg-[#F8F4EC]"],[class*="bg-[#C1B4A4]"]{background-color:#fff!important}[class*="bg-[#A87850]"],[class*="bg-[#70452F]"],[class*="bg-[#39271F]"]{background:linear-gradient(120deg,#00df86,#087ff5 72%,#32cfff)!important;color:#fff!important}[class*="text-[#A87850]"],[class*="text-[#70452F]"]{color:#087ff5!important}[class*="text-[#39271F]"]{color:#14221d!important}[class*="border-"]{border-color:#00df86!important}hr{border-color:#00df86!important}footer{border-top:2px solid #00df86!important}button,.aldo-add-button{box-shadow:0 5px 18px #087ff533}article{box-shadow:0 5px 22px #087ff516!important}img{max-width:100%}@media(max-width:640px){body,main{overflow-x:hidden!important}header nav{background:#fff!important;border-color:#00df86!important}}</style></head><body>
<header><a href="/" style="text-decoration:none"><span class="logo">Banke Bihari</span><span class="tag">CAFE • EATERY • WORKSPACE</span></a><span id="who"></span></header>
<main id="app"></main><footer>EAT • RELAX • REPEAT</footer>
<script>
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const BASE=location.protocol==='file:'?'http://localhost:3000':'';
const sl=document.createElement('script');sl.src=BASE+'/socket.io/socket.io.js';document.head.appendChild(sl);
let tok=sessionStorage.aldoTok,role=sessionStorage.aldoRole,sock; // per-tab session: different roles can be logged in in different tabs
const api=async(p,m='GET',b)=>{const r=await fetch(BASE+'/api'+p,{method:m,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
const QT=new URLSearchParams(location.search).get('t');
// ===== CUSTOMER (opened from table QR) =====
async function customer(){let t;try{t=await api('/table/'+QT)}catch{app.innerHTML='<div class=card>Invalid or expired QR code. Please scan the table QR again.</div>';return}
 const menu=await api('/menu');let cart={},cat=null,myOrder=localStorage['aldoOrder'+QT];const cats=[...new Set(menu.map(m=>m.category||'Menu'))];cat=cats[0];
 const total=()=>menu.reduce((s,m)=>s+m.price*(cart[m.id]||0),0),count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
 const draw=()=>{app.innerHTML=`<h2>Table ${t.number}</h2><div id=track></div>`+(menu.length?`<div class=tabs>${cats.map(c=>`<span class="chip ${c===cat?'on':''}" onclick="setCat(this.dataset.c)" data-c="${esc(c)}">${esc(c)}</span>`).join('')}</div><div class=grid>`+
  menu.filter(m=>(m.category||'Menu')===cat).map(m=>`<div class=card><span class=chip>${m.veg?'Veg':'Non-veg'}</span><h3>${esc(m.name)}</h3><div class=price>₹${m.price}</div><br>
  <button class="alt step" onclick="cartAdd(${m.id},-1)">−</button> &nbsp;${cart[m.id]||0}&nbsp; <button class=step onclick="cartAdd(${m.id},1)">+</button></div>`).join('')+'</div>':'<div class=card>Our menu is being prepared. Please ask your waiter.</div>')+
  `<div class=bar><span><b>${count()} items • ₹${total()}</b><br><input id=note placeholder="Special instructions" style="margin:0"></span><span><button class=alt onclick="callW()">Call waiter</button> <button onclick="place()">Place order</button></span></div>`;if(myOrder)track()};
 window.setCat=c=>{cat=c;draw()};window.cartAdd=(id,d)=>{cart[id]=Math.max(0,(cart[id]||0)+d);const n=$('#note')?.value;draw();if(n)$('#note').value=n};
 window.place=async()=>{const items=Object.entries(cart).filter(e=>e[1]).map(([id,q])=>({menuId:+id,qty:q,note:$('#note').value}));
  try{const o=await api('/orders','POST',{token:QT,items});localStorage['aldoOrder'+QT]=myOrder=o.id;cart={};draw()}catch(e){alert(e.message)}};
 window.callW=()=>api('/call','POST',{token:QT,message:prompt('Need something? (optional message)')||''}).then(()=>alert('Your waiter has been notified'));
 async function track(){const o=await api(`/orders/${myOrder}?token=${QT}`),steps=['new','accepted','preparing','ready','served'];
  $('#track').innerHTML=`<div class=card><b>Order #${o.id}</b> ${steps.map(s=>`<span class="chip ${s===o.status?'on':''}" style="${s===o.status?'background:var(--ca);color:var(--w)':''}">${s}</span>`).join('')}${o.paid?' <span class=chip>Paid</span>':''}<br>Total incl. GST <span class=price>₹${o.bill?o.bill.total:o.total}</span></div>`}
 (typeof io!=='undefined')&&io(BASE||undefined).on('order:update',o=>{if(o.id==myOrder)track()});setInterval(()=>myOrder&&track().catch(()=>{}),10000);draw()}
// ===== STAFF =====
const NAV={admin:[['Dashboard','🏠'],['Tables','🪑','Table Manager'],['Orders','🛎'],['POS','🧾'],['Payments','💳'],['Bookings','📅'],['Alerts','🔔'],['Menu','🍽'],['Inventory','📦'],['Staff','👥'],['Reports','📊'],['Settings','⚙️']],
pos:[['Dashboard','🏠'],['Tables','🪑','Table Manager'],['Orders','🛎'],['POS','🧾'],['Payments','💳'],['Bookings','📅'],['Alerts','🔔']],
kitchen:[['Dashboard','🏠'],['Incoming Orders','📋'],['Preparing Orders','🍳'],['Ready Orders','✅'],['Kitchen Alert','🔔'],['Menu View','🍽']],
waiter:[['Dashboard','🏠'],['New Orders','📝'],['Serve Orders','🛎'],['Table Status','🪑'],['Customer Support','💬'],['Menu View','🍽']]};
const ALERTV={admin:'Alerts',pos:'Alerts',kitchen:'Kitchen Alert',waiter:'Customer Support'};
const LIVE=['Dashboard','Orders','Tables','Bookings','Alerts','Payments','Incoming Orders','Preparing Orders','Ready Orders','Kitchen Alert','New Orders','Serve Orders','Table Status','Customer Support'],V={},money=n=>'₹'+(Math.round(n*100)/100),val=id=>$('#'+id).value;
let view=sessionStorage.aldoView;
const act=fn=>async(...a)=>{try{await fn(...a);show(true)}catch(e){alert(e.message)}};
function login(msg){app.style.cssText='';app.innerHTML=`<div class=card style="max-width:380px;margin:30px auto"><h2>Staff login</h2><input id=u placeholder=Username autocomplete=username><br><input id=p type=password placeholder=Password autocomplete=current-password onkeydown="if(event.key==='Enter')doLogin()"><br>
 <button id=lb onclick="doLogin()">Login</button><p id=err style="color:#ba1a1a;font-size:13px">${msg||''}</p><p><small>Guests: please scan the QR code on your table to order.</small></p></div>`}
window.doLogin=async()=>{const b=$('#lb');b.disabled=true;$('#err').textContent='';
 try{const r=await api('/login','POST',{username:$('#u').value.trim(),password:$('#p').value});tok=sessionStorage.aldoTok=r.token;role=sessionStorage.aldoRole=r.role;sessionStorage.aldoUser=$('#u').value.trim();view=null;staff()}
 catch(e){$('#err').textContent=/fetch|NetworkError/i.test(e.message)?'Cannot reach the server. Run "npm start" and open http://localhost:3000':e.message;b.disabled=false}};
window.logout=()=>{sessionStorage.clear();location.href='/app.html#staff';location.reload()};
const ping=()=>{try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},200);navigator.vibrate&&navigator.vibrate(200)}catch{}};
let L={orders:[],tables:[],calls:[],notices:[],bookings:[],settings:{}};
const ICON={admin:'🛡',kitchen:'👨‍🍳',waiter:'🤵',pos:'💁'},ROLE={admin:'Admin',kitchen:'Kitchen Dashboard',waiter:'Waiter Dashboard',pos:'Reception'};
function staff(){document.body.classList.add('staff');app.style.cssText='max-width:none;padding:0';if(['kitchen','waiter'].includes(role)&&navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});const nm=sessionStorage.aldoUser||role;
 $('#who').innerHTML=`<div class=row><span class=hello>${ICON[role]} Hello, ${esc(nm)}!<small>${ROLE[role]}</small></span><span id=clk class=chip></span><button class=bell onclick="go(ALERTV[role]||'Dashboard')">🔔<i id=bn>0</i></button><button class=alt onclick=logout()>Logout</button></div>`;
 setInterval(()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})},1000);
 if(!NAV[role].some(n=>n[0]===view))view='Dashboard';
 app.innerHTML=`<div class=layout><aside>${NAV[role].map(n=>`<a data-n="${n[0]}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]||n[0]}<b hidden></b></a>`).join('')}</aside><section id=view></section></div>`;
 const g=()=>{if(typeof io==='undefined')return setTimeout(g,300);sock=io(BASE||undefined,{auth:{token:tok}});['order:new','order:update','order:ready','call','notice','booking:new'].forEach(e=>sock.on(e,()=>{if(({kitchen:['order:new','notice'],waiter:['order:ready','call','notice'],pos:['call','booking:new'],admin:['call','booking:new']}[role]||[]).includes(e))ping();LIVE.includes(view)&&show()}))};g();
 setInterval(()=>LIVE.includes(view)&&show(),15000);show(true)}
window.go=n=>{view=sessionStorage.aldoView=n;show()};
function badges(){const o=L.orders,n=(s)=>o.filter(x=>x.status===s).length,al=L.calls.length+L.notices.length,
 B={admin:{Orders:n('new'),Alerts:al},pos:{Orders:n('new'),Alerts:al},kitchen:{'Incoming Orders':n('new'),'Kitchen Alert':L.notices.length},waiter:{'Serve Orders':n('ready'),'Customer Support':L.calls.length}}[role]||{};
 document.querySelectorAll('aside a').forEach(a=>{const v=B[a.dataset.n]||0,b=a.querySelector('b');b.hidden=!v;b.textContent=v});const bn=$('#bn');if(bn)bn.textContent=Object.entries(B).filter(([k])=>k===ALERTV[role]).reduce((s,[,v])=>s+v,0)}
async function show(force){document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.n===view));
 if(!force&&LIVE.includes(view)&&document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
 try{L=await api('/live');badges();$('#view').innerHTML=await V[view]()}catch(e){if(/unauthor|forbidden/i.test(e.message))return login('Session expired. Please log in again.');$('#view').innerHTML='<div class=card>'+esc(e.message)+'</div>'}}
const stat=(n,l,c)=>`<div class="card ${c||''}" style="text-align:center"><div style="font:500 30px 'Space Grotesk';color:var(--co)">${n}</div><small>${l}</small></div>`;
const nextOf={new:'accepted',accepted:'preparing',preparing:'ready',ready:'served'},can={kitchen:['new','accepted','preparing'],waiter:['ready'],admin:['new','accepted','preparing','ready'],pos:[]};
const oc=o=>{const mins=Math.floor((Date.now()-o.createdAt)/60000),late=mins>=15&&!['served','cancelled'].includes(o.status),cash=['admin','pos'].includes(role);
 return `<div class=card><b>#${o.id} • ${o.table?'Table '+o.table:'Takeaway'}</b> <span class="chip ${late?'red':''}">${o.status}${o.paid?' • paid':''}</span> <small>${mins} min</small><br>${o.items.map(i=>`${i.qty}× ${esc(i.name)}${i.note?' <i>('+esc(i.note)+')</i>':''}`).join('<br>')}<div class=price>${money(o.total)}${o.discount?' (disc '+money(o.discount)+')':''}</div><div class=row>`+
 (can[role].includes(o.status)?`<button onclick="mv(${o.id},'${nextOf[o.status]}')">${nextOf[o.status]}</button>`:'')+
 (cash&&o.status==='served'&&!o.paid?`<select id=pm${o.id}><option value=cash>Cash</option><option value=card-terminal>Card terminal</option><option value=upi-counter>UPI at counter</option></select><button onclick="pay(${o.id})">Pay</button>`:'')+
 (cash?`<button class=alt onclick="printBill(${o.id})">Bill</button>`:'')+(cash&&!o.paid&&o.status!=='cancelled'?`<button class=alt onclick="cancelO(${o.id})">Cancel</button>`:'')+`</div></div>`};
window.mv=act((id,s)=>api(`/orders/${id}/status`,'PATCH',{status:s}));window.pay=act(id=>api(`/orders/${id}/pay`,'POST',{method:val('pm'+id)}));
window.cancelO=act(id=>confirm('Cancel this order?')&&api(`/orders/${id}/cancel`,'POST'));
window.printBill=async id=>{try{const {shop,order:o,bill:b}=await api(`/orders/${id}/bill`),w=window.open('','_blank');
 w.document.write(`<pre style="font:13px monospace;width:300px">${esc(shop.name)}\n${shop.gstin?'GSTIN '+esc(shop.gstin)+'\n':''}${o.invoiceNo?'Invoice '+o.invoiceNo:'PROVISIONAL BILL'}  Order #${o.id}\n${new Date().toLocaleString()}  ${o.table?'Table '+o.table:'Takeaway'}\n--------------------------------\n${o.items.map(i=>`${i.qty} x ${esc(i.name)}  ${money(i.qty*i.price)}`).join('\n')}\n--------------------------------\nSubtotal ${money(b.subtotal)}\n${b.discount?'Discount -'+money(b.discount)+'\n':''}CGST ${b.gstPercent/2}% ${money(b.cgst)}\nSGST ${b.gstPercent/2}% ${money(b.sgst)}\nTOTAL ${money(b.total)}${b.inclusive?' (tax incl.)':''}\n${o.paid?'Paid: '+o.payment.method:'Unpaid'}\n\nEat • Relax • Repeat</pre>`);w.document.close();w.print()}catch(e){alert(e.message)}};
V.Orders=async()=>{const os=await api('/orders'),by=s=>os.filter(o=>o.status===s),q=[...by('new'),...by('accepted'),...by('preparing')],tb=by('served').filter(o=>!o.paid);
 const cols=role==='kitchen'?[['New',by('new')],['Accepted',by('accepted')],['Preparing',by('preparing')],['Ready',by('ready')]]:role==='waiter'?[['Preparing',q],['Ready to serve',by('ready')],['Served, unpaid',tb]]:[['Kitchen',q],['Ready',by('ready')],['To bill',tb],['Paid (latest)',os.filter(o=>o.paid).slice(-8)]];

 <div class=dash><div class=c8>${P('Incoming orders',kTable(inc))}</div><div class=c4>${P('Order progress',o?`<div class=steps>${['Order received','Preparing','Ready','Served'].map((x,i)=>`<span class="${i===idx?'on':''}">${x}</span>`).join('')}</div><h3>${o.table?'Table '+o.table:'Takeaway'} • #${o.id}</h3>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join('<br>')}<br><small>Order time ${tm(o.createdAt)} • est. ready ${tm(o.createdAt+(ap||12)*60000)}</small>`:'<small>No active order</small>')}
 ${P('Kitchen alert',kAlerts())}</div></div>`}
const kAlerts=()=>[...L.notices.map(alertRow),...L.orders.filter(o=>!['served','cancelled'].includes(o.status)&&o.items.some(i=>i.note)).map(o=>`<div class=alert><span>📝 <b>Table ${o.table||'TA'}</b> special request: ${o.items.filter(i=>i.note).map(i=>esc(i.note)).join(', ')}</span></div>`)].join('')||'<small>No alerts</small>';
const kTable=l=>`<table class=t><tr><th>#</th><th>Table</th><th>Items</th><th>Time</th><th>Status</th><th>Action</th></tr>${l.map(o=>`<tr onclick="selK=${o.id}"><td>${o.id}</td><td>${o.table?'T'+o.table:'TA'}</td><td>${o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</td><td>${tm(o.createdAt)}</td><td><span class="chip st-${o.status}">${o.status}</span></td><td>${o.status==='ready'?'':`<button onclick="mv(${o.id},'${nextOf[o.status]}')">${o.status==='new'?'▶ Start':'✔ Update'}</button>`}</td></tr>`).join('')||'<tr><td colspan=6>No orders</td></tr>'}</table>`;
function waitDash(){const t=today(),pend=L.orders.filter(o=>['new','accepted','preparing'].includes(o.status)),rd=L.orders.filter(o=>o.status==='ready'),sv=t.filter(o=>o.status==='served'),oc2=L.tables.filter(x=>x.status==='occupied').length,
 as=avg(L.orders.filter(o=>hist(o,'served')&&hist(o,'ready')).map(o=>hist(o,'served')-hist(o,'ready'))),last=L.orders.filter(o=>o.status==='served').pop();
 return `<div class=grid4>${sc('👥',pend.length,'Pending orders')}${sc('✅',sv.length,'Served today')}${sc('🪑',oc2+' / '+L.tables.length,'Occupied tables')}${sc('⏳',as+' min','Avg service time')}</div><br>
 <div class=dash><div class=c7>${P('Orders to serve',`<table class=t><tr><th>#</th><th>Table</th><th>Items</th><th>Time</th><th></th></tr>${rd.map(o=>`<tr><td>${o.id}</td><td>T${o.table}</td><td>${o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</td><td>${tm(o.createdAt)}</td><td><button onclick="mv(${o.id},'served')">▶ Serve</button></td></tr>`).join('')||'<tr><td colspan=5>Nothing ready yet</td></tr>'}</table>`)}</div>
 <div class=c5>${P('Table status',tiles('cycT'),'<small>tap to change</small>')}</div>
 <div class=c4>${P('Serve order',last?`<h3>✅ Order #${last.id} delivered</h3><small>Table ${last.table||'TA'} • thank you for your service!</small>`:'<small>No delivered order yet</small>')}</div>
 <div class=c4>${P('Customer support',L.calls.slice(0,3).map(alertRow).join('')||'<small>No requests</small>')}</div>
 <div class=c4>${P('Quick actions',`<div class=row><button onclick="go('Menu View')">View menu</button><button class=alt onclick="go('Table Status')">Check tables</button><button class=alt onclick="sendNote('kitchen','')">Call kitchen</button></div>`)}</div></div>`}
V.Dashboard=async()=>role==='kitchen'?kitDash():role==='waiter'?waitDash():recDash();
const ol=(title,f)=>`<h2>${title}</h2><div class=grid4>${L.orders.filter(f).map(oc).join('')||'<div class=card>None</div>'}</div>`;
V['Incoming Orders']=async()=>`<h2>Incoming orders</h2><div class=card>${kTable(L.orders.filter(o=>o.status==='new'))}</div>`;
V['Preparing Orders']=async()=>`<h2>Preparing orders</h2><div class=card>${kTable(L.orders.filter(o=>['accepted','preparing'].includes(o.status)))}</div>`;
V['Ready Orders']=async()=>ol('Ready orders',o=>o.status==='ready');V['New Orders']=async()=>ol('New orders (in kitchen)',o=>['new','accepted','preparing'].includes(o.status));
V['Serve Orders']=async()=>ol('Serve orders',o=>o.status==='ready');
V['Kitchen Alert']=async()=>`<h2>Kitchen alerts</h2><div class=card>${kAlerts()}</div>`;V.Alerts=async()=>`<h2>Alerts</h2><div class=card>${alerts()}</div><button onclick="sendNote(prompt('To (kitchen/waiter)','kitchen')||'kitchen','')">Send notification</button>`;
V['Customer Support']=async()=>`<h2>Customer support</h2><div class=card>${L.calls.map(alertRow).join('')||'<small>No requests</small>'}</div>`;
V['Table Status']=async()=>`<h2>Table status</h2><div class=card>${tiles('cycT')}<small>Tap a table to cycle available → occupied → needs clean</small></div>`;
V.Payments=async()=>`<h2>Payments</h2><div class=grid4>${L.orders.filter(o=>o.status==='served'&&!o.paid).map(oc).join('')||'<div class=card>No bills to collect</div>'}</div><div class=card><h3>Paid</h3><table class=t><tr><th>Invoice</th><th>Table</th><th>Method</th><th>Amount</th></tr>${L.orders.filter(o=>o.paid).reverse().map(o=>`<tr><td>${o.invoiceNo}</td><td>${o.table||'TA'}</td><td>${o.payment.method}${o.payment.verified?'':' (staff-confirmed)'}</td><td>${money(o.payment.amount)}</td></tr>`).join('')||'<tr><td colspan=4>None yet</td></tr>'}</table></div>`;
V['Menu View']=async()=>{const m=await api('/menu');return `<h2>Menu</h2><div class=card><table class=t><tr><th>Item</th><th>Category</th><th>Price</th></tr>${m.map(x=>`<tr><td>${esc(x.name)} <span class=chip>${x.veg?'Veg':'Non-veg'}</span></td><td>${esc(x.category)}</td><td>₹${x.price}</td></tr>`).join('')||'<tr><td colspan=3>No items yet</td></tr>'}</table></div>`};
if(QT)customer();else if(tok)staff();else if(location.hash==='#staff')login();else app.innerHTML='<div class=card style="max-width:480px;margin:30px auto"><h2>Order at your table</h2><p>Please scan the QR code on your table to open the menu and order.</p><a href="/">Back to Banke Bihari Cafe</a> • <a href="#staff" onclick="setTimeout(()=>location.reload())">Staff login</a></div>';
</script></body></html>
